# Rebuilds the /beta/ website whenever something in beta-src/ changes on main.
# Editing a text file (or adding a dog) on GitHub -> this runs -> the finished site lands in beta/ -> your host copies it.
name: Build beta site

on:
  push:
    branches: [main]
    paths: ['beta-src/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-beta
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build
        working-directory: beta-src
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Save the built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A beta
          if git diff --cached --quiet; then
            echo "No changes to the built site."
          else
            git commit -m "Rebuild beta site [skip ci]"
            git push
          fi
